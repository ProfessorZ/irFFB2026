name: Release

# Release pipeline for irFFB2026.
#
# Safety policy: pushes to master no longer auto-publish a release. The build
# job still runs on every master push (and on PRs) as a compile gate, but
# tagging and publishing a GitHub Release is a manual, reviewable step:
#
#   1. A maintainer runs this workflow on the commit to release
#      (Actions tab -> Run workflow -> optionally check "force").
#   2. The release job requires the protected "release" environment, so an
#      approver must approve before any tag is created or asset uploaded.
#   3. The published package is a zip containing the executable plus the GPL
#      LICENSE and third-party notices required for binary redistribution.
#
# Deriving the tag from version.h keeps releases traceable: if version.h still
# carries a version whose tag exists and resolves to a different commit, the
# run fails rather than attaching a freshly built exe to a stale tag.
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: 'Release version.h even if its tag already exists'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build & gate | Win32
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      should_release: ${{ steps.ver.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve version & decide whether to release
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path irFFB2026/version.h -Pattern 'IRFFB_VERSION_STR\s+"([^"]+)"'
          if (-not $m) { throw "Could not find IRFFB_VERSION_STR in irFFB2026/version.h" }
          $version = $m.Matches[0].Groups[1].Value
          $tag = "v$version"

          git fetch --tags --quiet
          $exists = [bool](git tag -l $tag)
          $force = ('${{ github.event_name }}' -eq 'workflow_dispatch') -and ('${{ inputs.force }}' -eq 'true')
          $should = (-not $exists) -or $force

          "version=$version"                              | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"                                      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "should_release=$($should.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$version tag=$tag tag_exists=$exists force=$force -> should_release=$should"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Release|Win32 is the canonical configuration: it is the only one with the
      # link dependencies (dinput8/dxguid/shlwapi/comctl32/winhttp/...) wired up.
      - name: Build (Release|Win32)
        run: msbuild irFFB2026.sln /m /verbosity:minimal /p:Configuration=Release /p:Platform=Win32

      - name: Verify version resource matches version.h
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $exe = Get-ChildItem -Recurse -Filter irFFB2026.exe | Select-Object -First 1
          if (-not $exe) { throw "irFFB2026.exe not found" }
          $info = (Get-Item $exe.FullName).VersionInfo
          $fileVer = "$($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart).$($info.FilePrivatePart)"
          $prodVer = "$($info.ProductMajorPart).$($info.ProductMinorPart).$($info.ProductBuildPart).$($info.ProductPrivatePart)"
          Write-Host "PE FileVersion=$fileVer ProductVersion=$prodVer version.h=$ver"
          if ($fileVer -ne $prodVer) { throw "FileVersion ($fileVer) != ProductVersion ($prodVer)" }
          $expected = $ver -replace '^\d+\.\d+\.', ''
          # Accept either "1.4.2.0" style or "1.4.2" style; require major.minor.patch agreement.
          $parts = $ver.Split('.')
          $peParts = @($info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart)
          for ($i = 0; $i -lt 3 -and $i -lt $parts.Length; $i++) {
            if ([int]$peParts[$i] -ne [int]$parts[$i]) {
              throw "PE version component $i ($($peParts[$i])) != version.h component ($($parts[$i]))"
            }
          }
          Write-Host "Version resource is consistent with version.h"

      - name: Stage package
        shell: pwsh
        run: |
          $exes = Get-ChildItem -Recurse -Filter irFFB2026.exe
          if ($exes.Count -ne 1) { throw "Expected exactly 1 irFFB2026.exe, found $($exes.Count)" }
          $stage = "stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $exes[0].FullName "$stage/irFFB2026.exe" -Force
          Copy-Item README.md "$stage/" -Force
          Copy-Item LICENSE "$stage/" -Force
          Copy-Item CREDITS.md "$stage/" -Force
          if (Test-Path THIRD_PARTY_NOTICES.md) { Copy-Item THIRD_PARTY_NOTICES.md "$stage/" -Force }
          Compress-Archive -Path "$stage/*" -DestinationPath "irFFB2026-${{ steps.ver.outputs.version }}-win32.zip" -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: irFFB2026-Release-Win32
          path: irFFB2026-${{ steps.ver.outputs.version }}-win32.zip
          if-no-files-found: error

  release:
    name: Tag & publish
    needs: build
    if: github.event_name == 'workflow_dispatch' && needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: irFFB2026-Release-Win32
          path: dist

      - name: Verify package contents
        run: |
          set -euo pipefail
          ls -la dist/
          zip=$(find dist -name '*.zip' | head -1)
          if [ -z "$zip" ]; then echo "::error::No zip in package"; exit 1; fi
          unzip -l "$zip"
          for required in irFFB2026.exe LICENSE CREDITS.md; do
            if ! unzip -l "$zip" | grep -q "$required"; then
              echo "::error::Package missing required file: $required"
              exit 1
            fi
          done
          echo "Package contents verified."

      - name: Create & push tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            existing="$(git rev-list -n 1 "${TAG}")"
            if [ "${existing}" != "${GITHUB_SHA}" ]; then
              echo "::error::Tag ${TAG} already exists at ${existing}, which differs from the commit being released (${GITHUB_SHA})."
              echo "Refusing to attach an exe built from ${GITHUB_SHA} to a tag pointing elsewhere."
              echo "Bump version.h, or deliberately delete/move the tag, then re-run."
              exit 1
            fi
            echo "Tag ${TAG} already exists at the current commit; reusing it (forced release)."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "irFFB2026 ${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: irFFB2026 ${{ needs.build.outputs.tag }}
          body_path: CHANGELOG.md
          files: dist/*.zip
          draft: false
          prerelease: false
